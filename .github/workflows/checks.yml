name: checks
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests and shell checks
        run: make test lint

  publish-arm64:
    needs: static-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the registry image
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the native ARM64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Private home portal for a single-node ARM64 Kubernetes lab
      - name: Record the immutable release
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          python3 -c 'import json,os; print(json.dumps({"image":os.environ["IMAGE"]+"@"+os.environ["DIGEST"],"revision":os.environ["REVISION"]},indent=2))' > release.json
          python3 scripts/release.py release.json
          printf 'ARM64 release: `%s@%s`\n\nGit revision: `%s`\n' "$IMAGE" "$DIGEST" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-portal-release
          path: release.json
          if-no-files-found: error
          retention-days: 30
