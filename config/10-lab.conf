apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# Keep the host's existing zram; Kubernetes pods cannot use swap.
failSwapOn: false
memorySwap:
  swapBehavior: NoSwap
# Leave room for existing non-Kubernetes services on this shared 8 GiB host.
systemReserved:
  memory: 2Gi
kubeReserved:
  memory: 512Mi
containerLogMaxSize: 5Mi
containerLogMaxFiles: 2
